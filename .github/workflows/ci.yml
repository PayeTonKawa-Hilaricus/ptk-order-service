name: 🛡️ CI/CD Pipeline - Quality & Security

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  # ===========================================================================
  # JOB 1: QUALITY CONTROL & SECURITY BASICS
  # Linting, Formatting, Dependency Audit, Secret Detection
  # ===========================================================================
  quality-check:
    name: 🔍 Quality & Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour Gitleaks (scan historique)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Formatage (Prettier)
      - name: 🎨 Check Formatting
        run: npx prettier --check .

      # 2. Linting Strict (ESLint)
      - name: 🧹 Linting Strict
        run: npm run lint

      # 3. Audit des dépendances (Vulnérabilités connues)
      - name: 🕵️ Dependency Audit
        run: npm audit --audit-level=high
        continue-on-error: true # On alerte mais on ne bloque pas forcément tout de suite

      # 4. Détection de Secrets (Remplacement : TruffleHog au lieu de Gitleaks)
      - name: 🐷 TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified --no-verification

  # ===========================================================================
  # JOB 2: TESTING (UNIT, INTEGRATION, CONTRACT)
  # Nécessite une base de données temporaire pour les tests d'intégration
  # ===========================================================================
  testing:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: quality-check # On ne teste que si la qualité est OK

    # Service Container : On lance un Postgres pour les tests E2E
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Healthcheck pour attendre que la DB soit prête
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. Tests Unitaires
      - name: 🧩 Unit Tests
        run: npm run test -- --coverage

      # 2. Tests d'Intégration (E2E)
      # On injecte les variables d'env pour se connecter au Service Postgres ci-dessus
      - name: 🔗 Integration Tests (E2E)
        run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: test_db

      # 3. Contract Testing (Pact)
      # Note: Ne s'exécute que si le script existe dans package.json
      - name: 🤝 Contract Testing (Pact)
        run: |
          if npm run | grep -q "test:pact"; then
            npm run test:pact
          else
            echo "⚠️ Pas de script 'test:pact' détecté, étape ignorée."
          fi

  # ===========================================================================
  # JOB 3: ADVANCED SECURITY (SAST)
  # Analyse statique du code pour trouver des failles de sécurité logiques
  # ===========================================================================
  sast-analysis:
    name: 🛡️ SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: quality-check
    permissions:
      security-events: write # Obligatoire pour uploader les rapports
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript # NestJS = Typescript/Javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ===========================================================================
  # JOB 4: DELIVERY (BUILD DOCKER)
  # Vérifie que l'image Docker se construit bien (sans la pousser pour l'instant)
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [testing, sast-analysis] # On ne build que si tout est vert

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # On ne push pas sur le Hub pour l'instant, on vérifie juste le build
          tags: payetonkawa/service:latest

  deploy-pc2:
    name: 🚀 Deploy on PC2
    # SÉCURITÉ MAXIMALE : On attend que TOUT soit vert (Tests + Sécurité + Build Docker)
    needs: [testing, sast-analysis, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, production-pc]

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🔄 Update & Restart Service
        shell: powershell
        run: |
          # --- CONFIGURATION ---
          $ROOT = "C:\PayeTonKawa"
          $INFRA_DIR = "$ROOT\ptk-infrastructure"
          $SERVICE_NAME = "${{ github.event.repository.name }}"

          Write-Host "🔥 DÉBUT DU DÉPLOIEMENT : $SERVICE_NAME"

          # 1. Mise à jour du code source du Micro-Service
          Write-Host "📥 Pull du code source..."
          cd "$ROOT\$SERVICE_NAME"
          git fetch origin
          git reset --hard origin/main

          # 2. Mise à jour de l'Infrastructure
          Write-Host "🏗️ Mise à jour de l'infra..."
          cd $INFRA_DIR
          git pull origin main

          # 3. Génération du .env DANS le dossier INFRA
          Write-Host "🔑 Génération des secrets..."

          if (Test-Path .env) { Remove-Item .env }

          # NOTE : On met PORT=3000 partout car c'est le port INTERNE du conteneur.
          # Docker fait le mapping vers l'extérieur (ex: 3002->3000) automatiquement.

          if ($SERVICE_NAME -eq "ptk-auth-service") {
             echo "DATABASE_URL=${{ secrets.AUTH_DATABASE_URL }}" >> .env
             echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
             echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> .env
             echo "PORT=3000" >> .env
          }
          elseif ($SERVICE_NAME -eq "ptk-product-service") {
             echo "DATABASE_URL=${{ secrets.PRODUCT_DATABASE_URL }}" >> .env
             echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
             echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> .env
             echo "PORT=3000" >> .env
          }
          elseif ($SERVICE_NAME -eq "ptk-order-service") {
             echo "DATABASE_URL=${{ secrets.ORDER_DATABASE_URL }}" >> .env
             echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
             echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> .env
             echo "PORT=3000" >> .env
          }
          elseif ($SERVICE_NAME -eq "ptk-client-service") {
             echo "DATABASE_URL=${{ secrets.CLIENT_DATABASE_URL }}" >> .env
             echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
             echo "RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}" >> .env
             echo "PORT=3000" >> .env
          }

          # 4. Relancer le conteneur
          Write-Host "🐳 Redémarrage du conteneur..."
          docker-compose up -d --build --no-deps $SERVICE_NAME

          # 5. Nettoyage
          docker image prune -f

          Write-Host "✅ Succès ! $SERVICE_NAME est déployé."
